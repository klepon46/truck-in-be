basePath: /
definitions:
  httpapi.APIError:
    properties:
      error:
        properties:
          code:
            example: VALIDATION_ERROR
            type: string
          message:
            example: movement input is invalid
            type: string
        type: object
    type: object
  httpapi.DataResponse:
    properties:
      data: {}
    type: object
  httpapi.ListResponse:
    properties:
      data: {}
      pagination:
        $ref: '#/definitions/operations.Page'
    type: object
  httpapi.activeDriverResponse:
    properties:
      driverName:
        type: string
      id:
        type: integer
    type: object
  httpapi.movementRequest:
    properties:
      coordinates:
        description: Optional for IN and OUT. Signed decimal latitude,longitude; omitted,
          null, or blank means unavailable. No geofence is applied.
        example: -3.319437,114.590889
        maxLength: 100
        type: string
      direction:
        allOf:
        - $ref: '#/definitions/movement.Direction'
        description: 'Required for all movements. IN requires inCategory and exactly
          one source: workOrderNumber, sppNumber, or OTHER fields. OUT requires outDestination
          and its matching fields.'
        enum:
        - IN
        - OUT
        example: OUT
      driverId:
        description: Required for OTHER movements in either direction.
        example: 42
        type: integer
      driverName:
        description: Required for OTHER movements in either direction.
        example: Driver Name
        type: string
      inCategory:
        description: Required only for IN. Must not be supplied for OUT.
        enum:
        - WAITING_FOR_ASSIGNMENT
        - WAITING_FOR_DELIVERY_TO_CUSTOMER
        - SERVICE_AND_REPAIR_MAINTENANCE
        type: string
      noLambung:
        description: Required for all movements. Populate from a document lookup or
          unit picker; do not derive it from a unit QR scan.
        example: SAMT223
        type: string
      note:
        description: Required for OTHER movements in either direction; optional for
          document-backed OUT movements.
        example: Operational note
        type: string
      outDestination:
        description: Required only for OUT. Must not be supplied for IN.
        enum:
        - BENGKEL_LUAR
        - FILLING_SHED_KUIN
        - CUSTOMER
        - OTHER
        type: string
      sppNumber:
        description: Required for FILLING_SHED_KUIN or CUSTOMER OUT and a returning
          IN for either SPP departure.
        example: SPP-001
        type: string
      workOrderNumber:
        description: Required for BENGKEL_LUAR OUT and a returning IN for a BENGKEL_LUAR
          departure.
        example: WO-001
        type: string
    required:
    - direction
    - noLambung
    type: object
  httpapi.unitPickerResponse:
    properties:
      noLambung:
        type: string
      noPolisi:
        type: string
    type: object
  movement.Direction:
    enum:
    - IN
    - OUT
    type: string
    x-enum-varnames:
    - DirectionIn
    - DirectionOut
  movement.LookupDocument:
    properties:
      customerId:
        type: string
      customerName:
        type: string
      driverName:
        type: string
      noLambung:
        type: string
      noPolisi:
        type: string
      sppNumber:
        type: string
      workOrderNumber:
        type: string
    type: object
  movement.SPPLookupDocument:
    properties:
      allowedOutDestinations:
        description: Always present, including [] when this valid SPP cannot be used
          for OUT. Does not restrict returning IN.
        items:
          enum:
          - CUSTOMER
          - FILLING_SHED_KUIN
          type: string
        type: array
        x-nullable: false
      customerId:
        type: string
      customerName:
        type: string
      driverName:
        type: string
      noLambung:
        type: string
      noPolisi:
        type: string
      sppNumber:
        type: string
      workOrderNumber:
        type: string
    required:
    - allowedOutDestinations
    type: object
  movement.Transaction:
    properties:
      actorId:
        type: string
      actorName:
        type: string
      coordinates:
        type: string
        x-nullable: "true"
      customerId:
        type: string
        x-nullable: "true"
      customerName:
        type: string
        x-nullable: "true"
      cycleId:
        type: integer
        x-nullable: "true"
      departureSppNumber:
        type: string
        x-nullable: "true"
      departureTransactionId:
        type: integer
        x-nullable: "true"
      departureWorkOrderNumber:
        type: string
        x-nullable: "true"
      direction:
        $ref: '#/definitions/movement.Direction'
      driverId:
        type: integer
        x-nullable: "true"
      driverName:
        type: string
        x-nullable: "true"
      inCategory:
        type: string
        x-nullable: "true"
      lambungUnitId:
        type: integer
      noLambung:
        type: string
      noPolisi:
        type: string
      note:
        type: string
        x-nullable: "true"
      occurredAt:
        type: string
      outDestination:
        type: string
        x-nullable: "true"
      sppNumber:
        type: string
        x-nullable: "true"
      transactionId:
        type: integer
      workOrderNumber:
        type: string
        x-nullable: "true"
    type: object
  operations.Dashboard:
    properties:
      totalUnits:
        type: integer
      unitsIn:
        type: integer
      unitsNoStatus:
        type: integer
      unitsOut:
        type: integer
    type: object
  operations.Page:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
    type: object
  operations.Transaction:
    properties:
      actorName:
        type: string
      coordinates:
        type: string
        x-nullable: "true"
      customerName:
        type: string
        x-nullable: "true"
      cycleId:
        type: integer
        x-nullable: "true"
      departureSppNumber:
        type: string
        x-nullable: "true"
      departureTransactionId:
        type: integer
        x-nullable: "true"
      departureWorkOrderNumber:
        type: string
        x-nullable: "true"
      direction:
        type: string
      driverName:
        type: string
        x-nullable: "true"
      durationSeconds:
        type: integer
      inCategory:
        type: string
        x-nullable: "true"
      noLambung:
        type: string
      noPolisi:
        type: string
      note:
        type: string
        x-nullable: "true"
      occurredAt:
        type: string
      outDestination:
        type: string
        x-nullable: "true"
      sppNumber:
        type: string
        x-nullable: "true"
      statusCompletedAt:
        type: string
        x-nullable: "true"
      transactionId:
        type: integer
      workOrderNumber:
        type: string
        x-nullable: "true"
    type: object
  operations.Unit:
    properties:
      direction:
        type: string
        x-nullable: "true"
      driverName:
        type: string
        x-nullable: "true"
      durationSeconds:
        type: integer
      id:
        type: integer
      inCategory:
        type: string
        x-nullable: "true"
      isActive:
        type: boolean
      lastUpdatedAt:
        type: string
        x-nullable: "true"
      noLambung:
        type: string
      noPolisi:
        type: string
      outDestination:
        type: string
        x-nullable: "true"
      status:
        type: string
    type: object
info:
  contact: {}
  description: |-
    API for immutable truck IN/OUT movements and pool operations.
    Movement scans require `unitlog:app:default:view`, actor ID/name claims, and an Idempotency-Key UUID. Operations require `unitlog:web:default:view`.
  title: UnitLog Pool Basirih API
  version: 1.0.0
paths:
  /api/v1/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/operations.Dashboard'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Get operational dashboard totals
      tags:
      - Operations
  /api/v1/drivers:
    get:
      parameters:
      - description: Driver name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/httpapi.activeDriverResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Search active drivers
      tags:
      - Movements
  /api/v1/movement-documents/spp:
    get:
      description: Returns document data and backend-derived allowedOutDestinations.
        An empty array prevents a new SPP OUT but does not invalidate a returning-IN
        lookup. Submit always revalidates current eligibility.
      parameters:
      - description: SPP number
        in: query
        name: number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/movement.SPPLookupDocument'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Look up a scanned SPP
      tags:
      - Movements
  /api/v1/movement-documents/work-orders:
    get:
      parameters:
      - description: Work order number
        in: query
        name: number
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/movement.LookupDocument'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Look up a scanned work order
      tags:
      - Movements
  /api/v1/movements:
    post:
      consumes:
      - application/json
      description: Records an IN or OUT transaction after document lookup or unit/driver
        selection. A returning IN must submit the same WO/SPP as its open OUT; OTHER
        is required when returning from OTHER. Retries must reuse the same Idempotency-Key
        and request body.
      parameters:
      - description: UUID generated once per movement
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Movement request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.movementRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/movement.Transaction'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Record a unit movement
      tags:
      - Movements
  /api/v1/transactions:
    get:
      parameters:
      - description: Search no_lambung or no_polisi
        in: query
        name: query
        type: string
      - description: Movement direction
        enum:
        - IN
        - OUT
        in: query
        name: direction
        type: string
      - description: IN category or OUT destination
        in: query
        name: detail
        type: string
      - description: Inclusive RFC3339 UTC timestamp
        in: query
        name: from
        type: string
      - description: Exclusive RFC3339 UTC timestamp
        in: query
        name: to
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 25
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/operations.Transaction'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: List transactions
      tags:
      - Operations
  /api/v1/transactions/export:
    get:
      parameters:
      - description: Search no_lambung or no_polisi
        in: query
        name: query
        type: string
      - description: Movement direction
        enum:
        - IN
        - OUT
        in: query
        name: direction
        type: string
      - description: IN category or OUT destination
        in: query
        name: detail
        type: string
      - description: Inclusive RFC3339 UTC timestamp
        in: query
        name: from
        type: string
      - description: Exclusive RFC3339 UTC timestamp
        in: query
        name: to
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Export transactions
      tags:
      - Operations
  /api/v1/unit-picker:
    get:
      parameters:
      - description: Search no_lambung or no_polisi
        in: query
        name: query
        type: string
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 25
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/httpapi.unitPickerResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: List units for the movement picker
      tags:
      - Movements
  /api/v1/units:
    get:
      parameters:
      - description: Search no_lambung or no_polisi
        in: query
        name: query
        type: string
      - description: Current direction
        enum:
        - IN
        - OUT
        - "NULL"
        in: query
        name: status
        type: string
      - description: Current OUT destination
        enum:
        - BENGKEL_LUAR
        - FILLING_SHED_KUIN
        - CUSTOMER
        - OTHER
        in: query
        name: destination
        type: string
      - description: Include inactive units
        in: query
        name: includeInactive
        type: boolean
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 25
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/operations.Unit'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: List units
      tags:
      - Operations
  /api/v1/units/{id}:
    get:
      parameters:
      - description: Unit Lambung ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/operations.Unit'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Get unit detail
      tags:
      - Operations
  /api/v1/units/{id}/transactions:
    get:
      parameters:
      - description: Unit Lambung ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 25
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httpapi.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/operations.Transaction'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: List unit transactions
      tags:
      - Operations
  /api/v1/units/export:
    get:
      parameters:
      - description: Search no_lambung or no_polisi
        in: query
        name: query
        type: string
      - description: Current direction
        enum:
        - IN
        - OUT
        - "NULL"
        in: query
        name: status
        type: string
      - description: Current OUT destination
        enum:
        - BENGKEL_LUAR
        - FILLING_SHED_KUIN
        - CUSTOMER
        - OTHER
        in: query
        name: destination
        type: string
      - description: Include inactive units
        in: query
        name: includeInactive
        type: boolean
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpapi.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpapi.APIError'
      security:
      - BearerAuth: []
      summary: Export units
      tags:
      - Operations
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Auth Service JWT using the `Bearer <token>` format.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
